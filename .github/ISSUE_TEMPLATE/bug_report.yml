name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: POCO X4 Pro, Android 14 (HyperOS)
    validations:
      required: true
  - type: input
    id: fob
    attributes:
      label: Fob model and advertised name
      placeholder: iTAG
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.1.0
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`adb logcat -d -s TrackerBle TrackerService TrackerAlarm TrackerBoot TrackerScan`. Remove the fob MAC address if you do not want it public."
      render: text
